name: FamilyRecipes
options:
  bundleIdPrefix: com.zhangzhihao.familyrecipes
targets:
  FamilyRecipes:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - FamilyRecipes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zhangzhihao.familyrecipes
        DEVELOPMENT_ASSET_PATHS: '"FamilyRecipes/Assets.xcassets"'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        GENERATE_INFOPLIST_FILE: true
        ENABLE_PREVIEWS: true
        SWIFT_VERSION: "5.9"
