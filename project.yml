name: FamilyRecipes
options:
  bundleIdPrefix: com.zhangzhihao.familyrecipes
targets:
  FamilyRecipes:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    info:
      path: "FamilyRecipes/Info.plist"
      properties:
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    sources:
      - FamilyRecipes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zhangzhihao.familyrecipes
        DEVELOPMENT_ASSET_PATHS: '"FamilyRecipes/Assets.xcassets"'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        GENERATE_INFOPLIST_FILE: false
        ENABLE_PREVIEWS: true
        SWIFT_VERSION: "5.9"

  FamilyRecipesTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - FamilyRecipesTests
      - FamilyRecipes/Models/Models.swift
      - FamilyRecipes/Models/DTOs.swift
      - FamilyRecipes/Models/SyncEngine.swift
      - FamilyRecipes/Models/SupabaseManager.swift
      - FamilyRecipes/Models/AppState.swift
      - FamilyRecipes/Models/AIEngine.swift
      - FamilyRecipes/Models/SampleData.swift
      - FamilyRecipes/Models/ImageUtils.swift
      - FamilyRecipes/Models/NetworkMonitor.swift
      - FamilyRecipes/Models/SyncOutbox.swift
      - FamilyRecipes/Models/RealtimeManager.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true

  FamilyRecipesUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - FamilyRecipesUITests
    dependencies:
      - target: FamilyRecipes
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true


